[project]
name = "nameresolve"
version = "0.1.0"
description = "Name-variant entity resolution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "jellyfish>=1.3.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]